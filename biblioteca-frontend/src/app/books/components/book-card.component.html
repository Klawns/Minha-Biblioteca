<article class="card">
  <div class="cover" [class.failed]="imageFailed()">
    <div class="cover-loading" [class.hidden]="imageLoaded() || imageFailed()" aria-hidden="true">
      <mat-icon>image</mat-icon>
    </div>
    <img
      [src]="api.coverUrl(book())"
      [alt]="'Capa de ' + book().title"
      loading="lazy"
      (load)="onImageLoad()"
      (error)="onImageError()"
    />
    <div
      class="fallback"
      [class.visible]="imageFailed()"
      role="img"
      [attr.aria-label]="'Capa indisponível para ' + book().title"
    >
      <mat-icon>auto_stories</mat-icon><span>Capa indisponível</span>
    </div>
  </div>
  <div class="details">
    <h2>{{ book().title }}</h2>
    <app-book-status-badge [status]="book().status" />
    <div class="actions">
      <a mat-stroked-button [href]="api.pdfUrl(book())" download aria-label="Baixar PDF"
        ><mat-icon>download</mat-icon>Baixar</a
      ><button
        mat-icon-button
        type="button"
        aria-label="Abrir ações do livro"
        (click)="actions.emit()"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
    </div>
  </div>
</article>
