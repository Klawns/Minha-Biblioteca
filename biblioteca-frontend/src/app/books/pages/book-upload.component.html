<main class="wizard"><a routerLink="/books" class="back"><mat-icon>arrow_back</mat-icon>Voltar</a><div class="progress"><span></span></div><p class="step">PASSO 1 DE 1</p><h1>Adicione um livro</h1><p class="lead">Envie seu PDF e nós cuidamos do resto.</p><label class="drop" for="pdf-file"><mat-icon>upload_file</mat-icon><strong>{{ selectedFile()?.name ?? 'Selecione seu arquivo PDF' }}</strong><small>{{ selectedFile() ? formatSize(selectedFile()!.size) : 'Máximo de 60 MB' }}</small><input id="pdf-file" type="file" accept="application/pdf,.pdf" aria-label="Selecionar arquivo PDF" (change)="choose($event)" /></label>@if (validationError(); as error) { <p class="error" role="alert">{{ error }}</p> } @if (serverError(); as error) { <p class="error" role="alert">{{ error }}</p> }<button class="save" mat-flat-button color="primary" [disabled]="!selectedFile() || saving()" (click)="save()">{{ saving() ? 'Salvando…' : 'Salvar Livro' }}<mat-icon>arrow_forward</mat-icon></button></main>
